Name: LIVE FIX AGUSTUS 2026 LOGO DI KIRI ATAS

on:
  schedule:
    # 17:15 UTC = 00:15 WIB (Setiap Hari Dini Hari)
    - cron: '15 17 * * *'
  workflow_dispatch:
    inputs:
      link_youtube:
        description: 'Link Video Sumber (Opsional jika menggunakan Secret)'
        required: false
      kunci_rtmp:
        description: 'Stream Key YouTube (Opsional jika menggunakan Secret)'
        required: false

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq curl
          sudo curl -L https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp -U

      - name: 4. Jalankan Relay Streaming
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          # Jika input manual/Secrets kosong, gunakan URL & Stream Key default di bawah ini
          LINK_YOUTUBE: ${{ inputs.link_youtube || secrets.LINK_YOUTUBE || 'https://www.youtube.com/live/CO1RGPKB8B8?si=gOTkzqiERLZm9BZ9' }}
          KUNCI_RTMP: ${{ inputs.kunci_rtmp || secrets.KUNCI_RTMP || 'szju-ryy4-e3qe-fx1j-axmx' }}
        run: |
          set +e

          if [ -z "$LINK_YOUTUBE" ] || [ -z "$KUNCI_RTMP" ]; then
            echo "❌ ERROR: LINK_YOUTUBE atau KUNCI_RTMP belum diisi!"
            echo "Harap sediakan melalui input workflow manual atau daftarkan di Repository Secrets."
            exit 1
          fi

          if [ -n "$YT_COOKIES" ] && [ "$YT_COOKIES" != "KOSONG" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          else
            COOKIE_ARG=""
          fi
          
          LOGO_FILE="logoihya7tvagustus2026.mp4"
          if [ ! -f "$LOGO_FILE" ]; then
            # Fallback jika nama file logo berbeda
            LOGO_FILE="logoihyajuni2026.mp4"
          fi

          if [ ! -f "$LOGO_FILE" ]; then
            echo "ERROR: File logo tidak ditemukan!"
            ls
            exit 1
          fi

          # User-Agent Safari iOS (Bypass 429 & Ramah Cookies)
          FIXED_UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_4_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.4.1 Mobile/15E148 Safari/604.1"

          while true; do
            echo "--- [$(date)] Mengambil Stream via Client iOS (Khusus Channel Susah Relay) ---"
            
            VIDEO_URL=$(yt-dlp $COOKIE_ARG \
                                --js-runtime node \
                                --force-ipv4 \
                                --no-cache-dir \
                                --user-agent "$FIXED_UA" \
                                --extractor-args "youtube:player-client=ios,mweb" \
                                -f "b/best" \
                                -g "$LINK_YOUTUBE" 2>yt_error.log)

            if [ -z "$VIDEO_URL" ]; then
              echo "⚠️ Client iOS gagal, mencoba Fallback Client TV..."
              VIDEO_URL=$(yt-dlp --force-ipv4 \
                                  --no-cache-dir \
                                  --extractor-args "youtube:player-client=tv_embedded" \
                                  -f "b/best" \
                                  -g "$LINK_YOUTUBE" 2>/dev/null)
            fi

            if [ -z "$VIDEO_URL" ]; then
              echo "❌ GAGAL MENDAPATKAN URL VIDEO! Menunggu 5 detik..."
              cat yt_error.log 2>/dev/null
              sleep 5
              continue
            fi

            echo "🚀 SUMBER DITEMUKAN! Memulai FFmpeg Auto-Kill & Anti-Nyandet..."

            # EKSEKUSI FFMPEG LOGO POJOK KIRI ATAS:
            ffmpeg \
              -rw_timeout 5000000 \
              -thread_queue_size 4096 -i "$VIDEO_URL" \
              -thread_queue_size 1024 -stream_loop -1 -i "$LOGO_FILE" \
              -filter_complex "[1:v]colorkey=0x006900:0.1:0.1,scale=iw*0.15:-1[logo]; [0:v][logo]overlay=(W*0.02):(W*0.02):shortest=1[outv]" \
              -map "[outv]" -map 0:a? \
              -c:v libx264 -preset ultrafast -tune zerolatency -b:v 3500k -maxrate 4500k -bufsize 4500k \
              -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 -ac 2 \
              -flvflags no_duration_filesize \
              -f flv "rtmp://a.rtmp.youtube.com/live2/$KUNCI_RTMP"

            echo "🔴 [TERDETEKSI] Stream terputus/lag/selesai! Mengulang otomatis dalam 2 detik..."
            sleep 2
          done
          
