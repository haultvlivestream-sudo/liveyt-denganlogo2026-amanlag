name: YouTube Downloader & Cutter 5x Speed

on:
  workflow_dispatch:
    inputs:
      link_youtube:
        description: 'Link Video YouTube'
        required: true
      waktu_mulai:
        description: 'Waktu Mulai (Contoh: 00:00:00)'
        required: true
        default: '00:00:00'
      waktu_selesai:
        description: 'Waktu Selesai (Contoh: 00:05:00 - Kosongkan jika sampai habis)'
        required: false
        default: ''

jobs:
  download-cut:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Tools (yt-dlp, ffmpeg, aria2c)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq curl aria2
          sudo curl -L https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: 3. Download & Potong Video Akurat (Super Fast 5x+ Multi-Connection)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ] && [ "$YT_COOKIES" != "KOSONG" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          else
            COOKIE_ARG=""
          fi

          FIXED_UA="Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

          echo "🚀 Memulai download dengan kecepatan tinggi (aria2c multi-connection)..."
          yt-dlp $COOKIE_ARG \
            --js-runtime node \
            --force-ipv4 \
            --no-cache-dir \
            --user-agent "$FIXED_UA" \
            --extractor-args "youtube:player-client=android,web" \
            -f "bestvideo+bestaudio/best" \
            --external-downloader aria2c \
            --external-downloader-args "-x 16 -s 16 -k 1M" \
            --merge-output-format mp4 \
            -o "video_mentah.mp4" \
            "${{ github.event.inputs.link_youtube }}"

          if [ ! -f "video_mentah.mp4" ]; then
            echo "❌ GAGAL MENDOWNLOAD VIDEO!"
            exit 1
          fi

          SS_ARG="-ss ${{ github.event.inputs.waktu_mulai }}"
          TO_ARG=""
          if [ -n "${{ github.event.inputs.waktu_selesai }}" ]; then
            TO_ARG="-to ${{ github.event.inputs.waktu_selesai }}"
          fi

          echo "✂️ Memotong video secara akurat sesuai waktu yang diminta..."
          
          ffmpeg -y $SS_ARG -i "video_mentah.mp4" $TO_ARG \
            -c:v copy -c:a copy \
            hasil_potong.mp4

          if [ ! -f "hasil_potong.mp4" ] || [ ! -s "hasil_potong.mp4" ]; then
            echo "⚠️ Melakukan fallback re-encode cepat untuk presisi maksimal..."
            ffmpeg -y $SS_ARG -i "video_mentah.mp4" $TO_ARG \
              -c:v libx264 -preset ultrafast -crf 22 \
              -c:a aac -b:a 192k \
              hasil_potong.mp4
          fi

          echo "✅ Proses potong video selesai!"

      - name: 4. Upload Hasil ke Artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: video-hasil-potong
          path: hasil_potong.mp4
          
