name: LIVE FIX DELAY AGUSTUS 2026 LOGO KANAN ATAS

on:
  workflow_dispatch:
    inputs:
      link_youtube:
        description: 'Link Video Sumber'
        required: true
      resolusi:
        description: 'Pilih Resolusi Maksimal'
        required: true
        default: '1080'
        type: choice
        options:
          - '1080'
          - '720'
          - '480'
          - 'best'
      kunci_rtmp:
        description: 'Stream Key YouTube'
        required: true

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq curl
          sudo curl -L https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp -U

      - name: 4. Jalankan Relay Streaming
        run: |
          set -e
          
          LOGO_FILE="logoihya7tvagustus2026.mp4"
          if [ ! -f "$LOGO_FILE" ]; then
            LOGO_FILE="logoihyajuni2026.mp4"
          fi

          if [ ! -f "$LOGO_FILE" ]; then
            echo "ERROR: File logo tidak ditemukan!"
            ls
            exit 1
          fi

          PILIHAN_RES="${{ github.event.inputs.resolusi }}"
          if [ "$PILIHAN_RES" = "best" ]; then
            FORMAT_SORT="-S vcodec:h264,res,ext"
          else
            FORMAT_SORT="-S vcodec:h264,res:$PILIHAN_RES,ext"
          fi

          echo "--- [$(date)] Mengambil Resolusi Max: $PILIHAN_RES (Bypass SABR 360p) ---"

          # CATATAN: Sengaja TANPA COOKIES agar terhindar dari pembatasan 360p server YouTube (SABR issue)
          # Menggunakan player-client=default,tv_simply terbukti paling ampuh meloloskan 1080p di issue #13965
          VIDEO_URL=$(yt-dlp --force-ipv4 \
                              --no-cache-dir \
                              --extractor-args "youtube:player-client=default,tv_simply" \
                              $FORMAT_SORT \
                              --get-url \
                              "${{ github.event.inputs.link_youtube }}" 2>yt_error.log) || true

          if [ -z "$VIDEO_URL" ]; then
            echo "⚠️ TV Simply gagal, mencoba fallback client android..."
            VIDEO_URL=$(yt-dlp --force-ipv4 \
                                --no-cache-dir \
                                --extractor-args "youtube:player-client=android" \
                                $FORMAT_SORT \
                                --get-url \
                                "${{ github.event.inputs.link_youtube }}" 2>/dev/null) || true
          fi

          if [ -z "$VIDEO_URL" ]; then
            echo "❌ GAGAL MENDAPATKAN URL VIDEO!"
            cat yt_error.log 2>/dev/null
            exit 1
          fi

          echo "🚀 SUMBER DITEMUKAN! Memulai FFmpeg Streaming..."

          # EKSEKUSI FFMPEG:
          # - Logo di pojok Kanan Atas: W-w-(W*0.02):H*0.02
          # - Kecepatan 1x (Real-time normal)
          # - Stream putus otomatis jika sumber mati
          ffmpeg \
            -rw_timeout 5000000 \
            -thread_queue_size 4096 -i "$VIDEO_URL" \
            -thread_queue_size 1024 -stream_loop -1 -i "$LOGO_FILE" \
            -filter_complex "[1:v]colorkey=0x006900:0.1:0.1,scale=iw*0.05:-1[logo]; [0:v][logo]overlay=W-w-(W*0.02):H*0.02:shortest=1[outv]" \
            -map "[outv]" -map 0:a? \
            -c:v libx264 -preset ultrafast -tune zerolatency -b:v 3500k -maxrate 4500k -bufsize 4500k \
            -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -flvflags no_duration_filesize \
            -f flv "rtmp://a.rtmp.youtube.com/live2/${{ github.event.inputs.kunci_rtmp }}"

          echo "🔴 Stream selesai atau terputus. Proses dihentikan."
          
