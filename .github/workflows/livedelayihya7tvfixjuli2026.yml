name: live delay agustus 2026

on:
  workflow_dispatch:
    inputs:
      link_youtube:
        description: 'Link Video Sumber'
        required: true
      kunci_rtmp:
        description: 'Stream Key YouTube'
        required: true
      pilihan_resolusi:
        description: 'Pilih Resolusi Maksimal'
        required: true
        default: '1080'
        type: choice
        options:
          - '1080'
          - '720'
          - '480'
          - 'best'

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq curl
          sudo curl -L https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp -U

      - name: 4. Jalankan Live Delay Streaming
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set +e

          if [ -n "$YT_COOKIES" ] && [ "$YT_COOKIES" != "KOSONG" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          else
            COOKIE_ARG=""
          fi
          
          LOGO_FILE="logoihya7tvagustus2026.mp4"
          if [ ! -f "$LOGO_FILE" ]; then
            LOGO_FILE="logoihyajuni2026.mp4"
          fi

          if [ ! -f "$LOGO_FILE" ]; then
            echo "ERROR: File logo tidak ditemukan!"
            ls
            exit 1
          fi

          # 2. PENAMBAHAN PILIHAN RESOLUSI & FORMAT PENGGABUNGAN LOKAL (PIPING)
          RES="${{ github.event.inputs.pilihan_resolusi }}"
          if [ "$RES" = "1080" ]; then
            FORMAT_STR="bestvideo[height<=1080]+bestaudio/best[height<=1080]"
          elif [ "$RES" = "720" ]; then
            FORMAT_STR="bestvideo[height<=720]+bestaudio/best[height<=720]"
          elif [ "$RES" = "480" ]; then
            FORMAT_STR="bestvideo[height<=480]+bestaudio/best[height<=480]"
          else
            FORMAT_STR="b/best"
          fi

          FIXED_UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_4_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.4.1 Mobile/15E148 Safari/604.1"

          echo "--- [$(date)] Memulai Live Delay Resolusi HD (${RES}p) dengan Piping Lokal ---"

          # 1 & 3. METODE PIPING (-o -) & JS RUNTIME NODE UNTUK DEKRIPSI SIGNATURE/PO_TOKEN
          yt-dlp $COOKIE_ARG \
                --js-runtime node \
                --force-ipv4 \
                --no-cache-dir \
                --user-agent "$FIXED_UA" \
                --extractor-args "youtube:player-client=ios,mweb" \
                -f "$FORMAT_STR" \
                -o - "${{ github.event.inputs.link_youtube }}" | \
          ffmpeg \
            -re \
            -thread_queue_size 4096 -i pipe:0 \
            -thread_queue_size 1024 -stream_loop -1 -i "$LOGO_FILE" \
            -filter_complex "[0:v]setpts=PTS/1.2[v_speed]; [1:v]colorkey=0x006900:0.1:0.1,scale=iw*0.15:-1[logo]; [v_speed][logo]overlay=W-w-(W*0.02):(H*0.02):shortest=1[outv]; [0:a]atempo=1.2[outa]" \
            -map "[outv]" -map "[outa]" \
            -c:v libx264 -preset ultrafast -tune zerolatency -b:v 3500k -maxrate 4500k -bufsize 4500k \
            -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -flvflags no_duration_filesize \
            -f flv "rtmp://a.rtmp.youtube.com/live2/${{ github.event.inputs.kunci_rtmp }}"

          EXIT_CODE=$?
          echo "🔴 [SELESAI] Proses streaming live delay berakhir dengan kode: $EXIT_CODE"
          exit 0
          
