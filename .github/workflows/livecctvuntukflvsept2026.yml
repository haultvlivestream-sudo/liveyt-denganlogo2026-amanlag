name: LIVE CCTV Fix Khusus FLV Sept 2026

on:
  workflow_dispatch:
    inputs:
      flv_url:
        description: '1. Link CCTV (.flv)'
        required: true
      audio_url:
        description: '2. Link YouTube (Audio)'
        required: true
      kunci_rtmp:
        description: '3. Stream Key YouTube'
        required: true

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Tools (FFmpeg & yt-dlp Nightly)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg jq curl
          sudo curl -L https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: 4. Jalankan Relay Streaming
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set +e

          if [ -n "$YT_COOKIES" ] && [ "$YT_COOKIES" != "KOSONG" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_OPT="--cookies cookies.txt"
          else
            COOKIE_OPT=""
          fi
          
          LOGO_FILE="logoihyajuni2026.mp4"
          if [ ! -f "$LOGO_FILE" ]; then
            echo "ERROR: File $LOGO_FILE tidak ditemukan!"
            ls
            exit 1
          fi

          FIXED_UA="Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

          while true; do
            echo "--- [$(date)] Mencari Kualitas Audio YouTube via Sesi Android ---"
            
            AUDIO_URL=$(yt-dlp $COOKIE_OPT \
                                --js-runtime node \
                                --force-ipv4 \
                                --no-cache-dir \
                                --user-agent "$FIXED_UA" \
                                --extractor-args "youtube:player-client=android,web" \
                                -f "bestaudio/best" \
                                -g "${{ github.event.inputs.audio_url }}" 2>yt_error.log)

            if [ -z "$AUDIO_URL" ]; then
              echo "❌ GAGAL MENDAPATKAN URL AUDIO YOUTUBE!"
              echo "=== DETAIL ERROR DARI YT-DLP ==="
              cat yt_error.log
              echo "================================="
              echo "Menunggu 10 detik sebelum mencoba kembali..."
              sleep 10
              continue
            fi

            echo "🚀 SUMBER DITEMUKAN! Menghubungkan ke CCTV FLV dan Audio..."

            # PENYESUAIAN KHUSUS HTTP FLV:
            # -http_persistent 0 : Memaksa sesi HTTP baru tanpa memakai ulang socket lama yang sudah mati
            
            ffmpeg -headers "User-Agent: $FIXED_UA" \
              -http_persistent 0 \
              -rw_timeout 15000000 \
              -analyzeduration 2000000 \
              -probesize 2000000 \
              -thread_queue_size 2048 \
              -reconnect 1 \
              -reconnect_at_eof 1 \
              -reconnect_streamed 1 \
              -reconnect_delay_max 10 \
              -fflags +genpts+discardcorrupt \
              -i "${{ github.event.inputs.flv_url }}" \
              -thread_queue_size 1024 \
              -stream_loop -1 \
              -i "$AUDIO_URL" \
              -thread_queue_size 1024 \
              -stream_loop -1 \
              -i "$LOGO_FILE" \
              -filter_complex "[0:v]scale=1280:720,setsar=1[main]; [2:v]colorkey=0x006900:0.1:0.1,scale=1280*0.08:-1[logo]; [main][logo]overlay=W-w-(W*0.025):(W*0.025)[v_out]" \
              -map "[v_out]" \
              -map 1:a \
              -c:v libx264 -preset ultrafast -tune zerolatency -b:v 4000k -maxrate 5000k -bufsize 8000k \
              -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -ar 44100 -b:a 128k \
              -shortest \
              -f flv "rtmp://a.rtmp.youtube.com/live2/${{ github.event.inputs.kunci_rtmp }}"

            echo "⚠️ Stream CCTV terputus / mereset koneksi. Mengulang dalam 5 detik..."
            sleep 5
          done
          
