name: Vidio Downloader From YT To Telegram Okt 2026

on:
  workflow_dispatch:
    inputs:
      link_youtube:
        description: 'Link Video YouTube Sumber'
        required: true
      resolusi:
        description: 'Pilih Resolusi Maksimal'
        required: true
        default: '1080'
        type: choice
        options:
          - '1080'
          - '720'
          - '480'
          - 'best'
      waktu_mulai:
        description: 'Mulai Potong (Format: HH:MM:SS)'
        required: true
        default: '00:00:00'
      waktu_selesai:
        description: 'Selesai Potong (Format: HH:MM:SS)'
        required: true
        default: '00:00:30'

jobs:
  download-dan-kirim:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Tools (FFmpeg & yt-dlp)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq curl
          sudo curl -L https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp -U

      - name: 4. Download, Enkode Mulus, & Kirim ke Telegram
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "❌ ERROR: TELEGRAM_BOT_TOKEN dan TELEGRAM_CHAT_ID wajib diisi!"
            exit 1
          fi

          if [ -n "$YT_COOKIES" ] && [ "$YT_COOKIES" != "KOSONG" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          else
            COOKIE_ARG=""
          fi

          PILIHAN_RES="${{ github.event.inputs.resolusi }}"
          if [ "$PILIHAN_RES" = "best" ]; then
            FORMAT_ARG="bestvideo+bestaudio/best"
          else
            FORMAT_ARG="bestvideo[height<=$PILIHAN_RES]+bestaudio/best[height<=$PILIHAN_RES]"
          fi

          START_TIME="${{ github.event.inputs.waktu_mulai }}"
          END_TIME="${{ github.event.inputs.waktu_selesai }}"
          RAW_FILE="raw_source.mp4"
          OUTPUT_FILE="hasil_video.mp4"

          echo "--- [$(date)] Memulai Download Utuh Super Cepat ---"

          # 1. Download utuh dengan kecepatan tinggi tanpa jeda/patah
          yt-dlp $COOKIE_ARG \
            --force-ipv4 \
            --no-cache-dir \
            --js-runtime node \
            --concurrent-fragments 10 \
            --merge-output-format mp4 \
            -f "$FORMAT_ARG" \
            -o "$RAW_FILE" \
            "${{ github.event.inputs.link_youtube }}"

          if [ ! -f "$RAW_FILE" ]; then
            echo "❌ ERROR: File gagal didownload!"
            exit 1
          fi

          echo "✅ Download selesai. Memotong dan merapikan frame dengan FFmpeg (Anti Patah-Patah)..."

          # 2. Potong dan enkode ulang menggunakan setelan libx264 ultrafast agar gambar dan audio super mulus normal
          if [ "$START_TIME" = "00:00:00" ] && [ "$END_TIME" = "00:00:00" ]; then
            cp "$RAW_FILE" "$OUTPUT_FILE"
          else
            ffmpeg -y \
              -ss "$START_TIME" \
              $( [ "$END_TIME" != "00:00:00" ] && echo "-to $END_TIME" ) \
              -i "$RAW_FILE" \
              -c:v libx264 -preset ultrafast -crf 23 \
              -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 -ac 2 \
              "$OUTPUT_FILE"
          fi

          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "❌ ERROR: Gagal memproses pemotongan video!"
            exit 1
          fi

          echo "✅ Video Berhasil Dirapikan! Ukuran file:"
          ls -lh "$OUTPUT_FILE"

          echo "--- [$(date)] Mengirim video mulus ke Telegram... ---"
          
          RESPONSE=$(curl -s -F chat_id="$TELEGRAM_CHAT_ID" \
                          -F video=@"$OUTPUT_FILE" \
                          -F caption="✅ Video berhasil dipotong mulus tanpa patah-patah! Resolusi: ${PILIHAN_RES}p (${START_TIME} - ${END_TIME})" \
                          https://api.telegram.org/bot"$TELEGRAM_BOT_TOKEN"/sendVideo)

          echo "Respon Telegram: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "🎉 Berhasil kirim ke Telegram!"
          else
            echo "⚠️ Gagal kirim sebagai video, mencoba sebagai dokumen..."
            curl -s -F chat_id="$TELEGRAM_CHAT_ID" \
                 -F document=@"$OUTPUT_FILE" \
                 -F caption="✅ File dokumen video (Resolusi: ${PILIHAN_RES}p)" \
                 https://api.telegram.org/bot"$TELEGRAM_BOT_TOKEN"/sendDocument
          fi

          echo "🔴 Proses selesai sepenuhnya."
          
