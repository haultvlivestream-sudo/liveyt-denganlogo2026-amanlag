name: LIVE FIX AGUSTUS KHUSUS CHANNEL YANG SUSAH DI RELAY

on:
  workflow_dispatch:
    inputs:
      link_youtube:
        description: 'Link Video Sumber'
        required: true
      kunci_rtmp:
        description: 'Stream Key YouTube'
        required: true

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq curl
          sudo curl -L https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp -U

      - name: 4. Jalankan Relay Streaming
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set +e

          if [ -n "$YT_COOKIES" ] && [ "$YT_COOKIES" != "KOSONG" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          else
            COOKIE_ARG=""
          fi
          
          LOGO_FILE="logoihya7tvagustus2026.mp4"
          if [ ! -f "$LOGO_FILE" ]; then
            LOGO_FILE="logoihyajuni2026.mp4"
          fi

          if [ ! -f "$LOGO_FILE" ]; then
            echo "ERROR: File logo tidak ditemukan!"
            ls
            exit 1
          fi

          FIXED_UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_4_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.4.1 Mobile/15E148 Safari/604.1"

          while true; do
            echo "--- [$(date)] Mengambil Stream HLS Live YouTube ---"
            
            # Format 96/95/94/93 memaksa yt-dlp mengambil HLS Manifest (.m3u8) resmi YouTube Live
            VIDEO_URL=$(yt-dlp $COOKIE_ARG \
                                --js-runtime node \
                                --force-ipv4 \
                                --no-cache-dir \
                                --user-agent "$FIXED_UA" \
                                --extractor-args "youtube:player-client=ios,mweb" \
                                -f "96/95/94/93/b/best" \
                                -g "${{ github.event.inputs.link_youtube }}" 2>yt_error.log)

            if [ -z "$VIDEO_URL" ]; then
              echo "⚠️ Client iOS gagal, mencoba Fallback Web Manifest..."
              VIDEO_URL=$(yt-dlp $COOKIE_ARG \
                                  --force-ipv4 \
                                  --no-cache-dir \
                                  -f "96/95/94/93/b/best" \
                                  -g "${{ github.event.inputs.link_youtube }}" 2>/dev/null)
            fi

            if [ -z "$VIDEO_URL" ]; then
              echo "❌ GAGAL MENDAPATKAN URL VIDEO! Menunggu 5 detik..."
              cat yt_error.log 2>/dev/null
              sleep 5
              continue
            fi

            echo "🚀 SUMBER DITEMUKAN! Memulai FFmpeg Live Relay..."

            ffmpeg \
              -user_agent "$FIXED_UA" \
              -headers "Referer: https://www.youtube.com/\r\n" \
              -multiple_requests 1 \
              -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 -reconnect_on_network_error 1 \
              -rw_timeout 15000000 \
              -thread_queue_size 8192 -i "$VIDEO_URL" \
              -thread_queue_size 2048 -stream_loop -1 -i "$LOGO_FILE" \
              -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2[main]; [1:v]colorkey=0x006900:0.1:0.1,scale=150:-1[logo_scaled]; [main][logo_scaled]overlay=W-w-20:20[outv]" \
              -map "[outv]" -map 0:a? \
              -c:v libx264 -preset ultrafast -tune zerolatency -b:v 3000k -maxrate 3500k -bufsize 3500k \
              -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 -ac 2 \
              -flvflags no_duration_filesize \
              -f flv "rtmp://a.rtmp.youtube.com/live2/${{ github.event.inputs.kunci_rtmp }}"

            echo "🔴 Stream terputus atau perlu refresh token! Mengulang dalam 3 detik..."
            sleep 3
          done
          
