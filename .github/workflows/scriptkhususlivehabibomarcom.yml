name: LIVE FIX AGUSTUS KHUSUS CHANNEL HABIB UMAR 2026

on:
  workflow_dispatch:
    inputs:
      link_youtube:
        description: 'Link Video Sumber'
        required: true
      kunci_rtmp:
        description: 'Stream Key YouTube'
        required: true

jobs:
  streaming:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq curl
          sudo curl -L https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp -U

      - name: 4. Jalankan Relay Streaming
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set +e

          if [ -n "$YT_COOKIES" ] && [ "$YT_COOKIES" != "KOSONG" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          else
            COOKIE_ARG=""
          fi
          
          LOGO_FILE="logoihya7tvagustus2026.mp4"
          if [ ! -f "$LOGO_FILE" ]; then
            # Fallback jika nama file logo berbeda
            LOGO_FILE="logoihyajuni2026.mp4"
          fi

          if [ ! -f "$LOGO_FILE" ]; then
            echo "ERROR: File logo tidak ditemukan!"
            ls
            exit 1
          fi

          # User-Agent Safari iOS (Bypass 429 & Ramah Cookies)
          FIXED_UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_4_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.4.1 Mobile/15E148 Safari/604.1"

          # STATUS TRACKING
          EVER_STARTED=0
          DISCONNECT_START=0

          while true; do
            # Pengecekan Timer jika sudah pernah jalan lalu terputus/masalah
            if [ "$EVER_STARTED" -eq 1 ] && [ "$DISCONNECT_START" -ne 0 ]; then
              CURRENT_TIME=$(date +%s)
              ELAPSED=$((CURRENT_TIME - DISCONNECT_START))
              REMAINING=$((180 - ELAPSED))

              if [ "$ELAPSED" -ge 180 ]; then
                echo "🛑 [STOP WORKFLOW] Live telah terputus/berhenti lebih dari 3 menit (180 detik). Menghentikan workflow..."
                exit 0
              else
                echo "⏳ Status: Pernah live. Sisa batas toleransi gangguan: ${REMAINING}s"
              fi
            fi

            echo "--- [$(date)] Mengambil Stream via Client iOS ---"
            
            VIDEO_URL=$(yt-dlp $COOKIE_ARG \
                                --js-runtime node \
                                --force-ipv4 \
                                --no-cache-dir \
                                --user-agent "$FIXED_UA" \
                                --extractor-args "youtube:player-client=ios,mweb" \
                                -f "b/best" \
                                -g "${{ github.event.inputs.link_youtube }}" 2>yt_error.log)

            if [ -z "$VIDEO_URL" ]; then
              echo "⚠️ Client iOS gagal, mencoba Fallback Client TV..."
              VIDEO_URL=$(yt-dlp --force-ipv4 \
                                  --no-cache-dir \
                                  --extractor-args "youtube:player-client=tv_embedded" \
                                  -f "b/best" \
                                  -g "${{ github.event.inputs.link_youtube }}" 2>/dev/null)
            fi

            # JIKA URL TIDAK DITEMUKAN
            if [ -z "$VIDEO_URL" ]; then
              echo "❌ GAGAL MENDAPATKAN URL VIDEO!"
              cat yt_error.log 2>/dev/null

              if [ "$EVER_STARTED" -eq 1 ] && [ "$DISCONNECT_START" -eq 0 ]; then
                DISCONNECT_START=$(date +%s)
              fi

              if [ "$EVER_STARTED" -eq 0 ]; then
                echo "⏳ Live belum pernah mulai. Memantau terus tanpa batas..."
              fi

              sleep 5
              continue
            fi

            echo "🚀 SUMBER DITEMUKAN! Memulai FFmpeg Relay..."

            # Catat waktu sebelum FFmpeg jalan
            STREAM_START_TIME=$(date +%s)

            ffmpeg \
              -rw_timeout 5000000 \
              -thread_queue_size 4096 -i "$VIDEO_URL" \
              -thread_queue_size 1024 -stream_loop -1 -i "$LOGO_FILE" \
              -filter_complex "[1:v]colorkey=0x006900:0.1:0.1,scale=iw*0.15:-1[logo]; [0:v][logo]overlay=W-w-(W*0.02):(W*0.02):shortest=1[outv]" \
              -map "[outv]" -map 0:a? \
              -c:v libx264 -preset ultrafast -tune zerolatency -b:v 3500k -maxrate 4500k -bufsize 4500k \
              -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 -ac 2 \
              -flvflags no_duration_filesize \
              -f flv "rtmp://a.rtmp.youtube.com/live2/${{ github.event.inputs.kunci_rtmp }}"

            STREAM_END_TIME=$(date +%s)
            DURATION=$((STREAM_END_TIME - STREAM_START_TIME))

            # Jika FFmpeg sempat berjalan lebih dari 30 detik, anggap live benar-benar stabil & reset timer putus
            if [ "$DURATION" -gt 30 ]; then
              EVER_STARTED=1
              DISCONNECT_START=0
              echo "✅ Stream berjalan stabil selama ${DURATION}s."
            else
              echo "⚠️ Stream terputus cepat/lag (hanya berjalan ${DURATION}s)."
              if [ "$EVER_STARTED" -eq 1 ] && [ "$DISCONNECT_START" -eq 0 ]; then
                DISCONNECT_START=$(date +%s)
              fi
            fi

            echo "🔴 [TERDETEKSI] Memproses ulang/reconnect dalam 2 detik..."
            sleep 2
          done
          
